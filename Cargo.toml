[package]
name = "konacha"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Konacha — offline-first, encrypted, native desktop notes."
authors = ["Konacha"]
license = "MIT OR Apache-2.0"

[dependencies]
# ── GUI ────────────────────────────────────────────────────────────────
eframe      = { version = "0.29", default-features = false, features = ["glow"] }
egui        = "0.29"

# ── Serialization ──────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Crypto / KDF ───────────────────────────────────────────────────────
aes-gcm     = "0.10"
argon2      = "0.5"
rand        = "0.8"
zeroize     = { version = "1", features = ["derive"] }

# ── Data ───────────────────────────────────────────────────────────────
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
walkdir     = "2"

# ── Native integrations ────────────────────────────────────────────────
rfd           = "0.15"
tray-icon     = "0.19"
global-hotkey = "0.6"

# ── Markdown ───────────────────────────────────────────────────────────
pulldown-cmark = "0.12"

# ── Extensibility ──────────────────────────────────────────────────────
mlua  = { version = "0.9", features = ["lua54", "vendored"] }
ureq  = { version = "2", features = ["json"] }

# ── Misc ───────────────────────────────────────────────────────────────
thiserror = "1"
log       = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", package = "gtk4", optional = true }

[features]
default = []
linux-tray = ["gtk"]      # enable on Linux if you have GTK4 installed

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
